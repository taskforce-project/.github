<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="TaskForce — Describe the outcome. TaskForce orchestrates the execution.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#93c5fd" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect width="1280" height="340" fill="url(#glow2)"/>

  <!-- Motif graphe (Brain OS), décoratif, discret -->
  <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.4" fill="none">
    <path d="M1040 70 L1140 120 M1140 120 L1090 210 M1090 210 L1180 250 M1040 70 L980 150 M980 150 L1090 210"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.5">
    <circle cx="1040" cy="70" r="5"/><circle cx="1140" cy="120" r="6"/>
    <circle cx="1090" cy="210" r="7"/><circle cx="980" cy="150" r="4.5"/>
    <circle cx="1180" cy="250" r="4"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="150" font-size="78" font-weight="800" fill="#f8fafc" letter-spacing="-1">TaskForce</text>
    <rect x="556" y="176" width="168" height="4" rx="2" fill="url(#accent)"/>
    <text x="640" y="222" font-size="25" font-weight="600" fill="#e2e8f0">Describe the outcome. TaskForce orchestrates the execution.</text>
    <text x="640" y="258" font-size="17" fill="#94a3b8">The execution layer over the tools your team already uses — it understands the work, drives the tools, helps you decide.</text>
    <text x="640" y="300" font-size="14.5" font-weight="600" fill="#64748b" letter-spacing="1.5">JAVA 21 · SPRING BOOT · NEXT.JS · SELF-HOSTED AI · KEYCLOAK · DOCKER</text>
  </g>
</svg>
